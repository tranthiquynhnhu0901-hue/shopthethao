<!-- =====================================================

===================================================== -->

<section class="page-hero">

    <div class="container">

        <span class="eyebrow">
            YOUR CART
        </span>

        <h1>
            GIỎ HÀNG
        </h1>

    </div>

</section>



<!-- =====================================================
     CART
===================================================== -->

<section class="section">

    <div class="container cart-layout">


        <!-- CART PRODUCTS -->

        <div id="cartList">
        </div>



        <!-- CART SUMMARY -->

        <aside class="cart-summary">


            <h2>
                Tóm tắt
            </h2>


            <div class="summary-row">

                <span>
                    Tạm tính
                </span>

                <b id="sub">
                    0đ
                </b>

            </div>



            <!-- COUPON -->

            <div
                style="
                    margin:18px 0;
                "
            >

                <input
                    id="coupon"
                    style="
                        width:65%;
                        padding:11px;
                        border:1px solid #ddd;
                    "
                    placeholder="SPORT10"
                >

                <button
                    class="btn-dark"
                    type="button"
                    onclick="coupon()"
                >
                    Áp dụng
                </button>

                <p
                    id="couponMsg"
                    style="
                        font-size:12px;
                        margin-top:6px;
                    "
                ></p>

            </div>



            <div class="summary-row">

                <span>
                    Giảm
                </span>

                <b id="dis">
                    0đ
                </b>

            </div>



            <div class="summary-total">

                <span>
                    Tổng
                </span>

                <b id="tot">
                    0đ
                </b>

            </div>



            <button
                class="btn-primary"
                type="button"
                style="
                    width:100%;
                "
                onclick="checkout()"
            >
                THANH TOÁN
            </button>


        </aside>


    </div>

</section>
