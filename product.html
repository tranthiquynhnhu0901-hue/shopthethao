<!doctype html>

<html lang="vi">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >


    <!-- =====================================================
         SEO

         product.js sẽ tự thay đổi:
         - Title
         - Meta Description
         - Robots
         theo đúng sản phẩm đang xem.
    ====================================================== -->

    <title id="pageTitle">
        Chi tiết sản phẩm | SPORTHUB
    </title>


    <meta
        id="metaDescription"
        name="description"
        content="Thông tin chi tiết sản phẩm thể thao tại SPORTHUB."
    >


    <meta
        name="robots"
        content="index, follow"
    >



    <!-- =====================================================
         CANONICAL

         product.js sẽ tự cập nhật thành:

         product.html?id=P01
         product.html?id=P02
         ...
         product.html?id=P52
    ====================================================== -->

    <link
        rel="canonical"
        href="https://tranthiquynhnhu0901-hue.github.io/shopthethao/product.html"
    >



    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
        property="og:type"
        content="product"
    >


    <meta
        property="og:locale"
        content="vi_VN"
    >


    <meta
        property="og:site_name"
        content="SPORTHUB"
    >


    <meta
        id="ogTitle"
        property="og:title"
        content="Sản phẩm SPORTHUB"
    >


    <meta
        id="ogDescription"
        property="og:description"
        content="Khám phá sản phẩm thể thao tại SPORTHUB."
    >


    <meta
        property="og:url"
        content="https://tranthiquynhnhu0901-hue.github.io/shopthethao/product.html"
    >


    <meta
        id="ogImage"
        property="og:image"
        content="https://tranthiquynhnhu0901-hue.github.io/shopthethao/images/banners/bn02-shop-hero.webp"
    >


    <meta
        property="og:image:alt"
        content="Sản phẩm thể thao SPORTHUB"
    >



    <!-- =====================================================
         PRODUCT OPEN GRAPH

         product.js sẽ tự thay:
         - Giá
         - Tiền tệ
         - Tình trạng tồn kho
    ====================================================== -->

    <meta
        property="product:price:amount"
        content=""
    >


    <meta
        property="product:price:currency"
        content="VND"
    >


    <meta
        property="product:availability"
        content=""
    >



    <!-- =====================================================
         SOCIAL CARD
    ====================================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >


    <meta
        name="twitter:title"
        content="Sản phẩm SPORTHUB"
    >


    <meta
        name="twitter:description"
        content="Khám phá sản phẩm thể thao tại SPORTHUB."
    >


    <meta
        name="twitter:image"
        content="https://tranthiquynhnhu0901-hue.github.io/shopthethao/images/banners/bn02-shop-hero.webp"
    >


    <meta
        name="twitter:image:alt"
        content="Sản phẩm thể thao SPORTHUB"
    >



    <!-- =====================================================
         SCHEMA.ORG

         product.js sẽ tự ghi dữ liệu động vào đây:

         - Product
         - Offer
         - BreadcrumbList

         Không tự tạo Review / AggregateRating.
    ====================================================== -->

    <script
        id="productSchema"
        type="application/ld+json"
    >
    {}
    </script>



    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>



<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="container nav">


            <!-- LOGO -->

            <a
                class="logo"
                href="index.html"
                aria-label="SPORTHUB - Trang chủ"
            >
                SPORT<span>HUB</span>
            </a>


            <!-- MENU -->

            <nav>

                <a href="index.html">
                    Trang chủ
                </a>


                <a
                    class="active"
                    href="shop.html"
                >
                    Sản phẩm
                </a>


                <a href="health-check.html">
                    Fitness Check
                </a>


                <a href="blog.html">
                    Blog
                </a>


                <a href="gioi-thieu/">
                    Giới thiệu
                </a>


                <a href="lien-he/">
                    Liên hệ
                </a>

            </nav>


            <!-- CART -->

            <a
                class="cart-link"
                href="cart.html"
                aria-label="Mở giỏ hàng"
            >

                🛒

                <span class="cart-count">
                    0
                </span>

            </a>


        </div>

    </header>



    <!-- =====================================================
         BREADCRUMB
    ====================================================== -->

    <div class="product-breadcrumb-wrap">

        <div class="container">

            <nav
                class="product-breadcrumb"
                aria-label="Breadcrumb"
            >

                <a href="index.html">
                    Trang chủ
                </a>

                <span>
                    /
                </span>

                <a href="shop.html">
                    Sản phẩm
                </a>

                <span>
                    /
                </span>

                <span id="breadcrumbProduct">
                    Chi tiết sản phẩm
                </span>

            </nav>

        </div>

    </div>



    <!-- =====================================================
         PRODUCT DETAIL
    ====================================================== -->

    <main
        id="productDetail"
        class="product-detail-page"
    >

        <!--
            Toàn bộ nội dung sản phẩm
            sẽ được product.js render tại đây.

            Bao gồm:

            - Tên sản phẩm
            - Ảnh sản phẩm
            - Mã sản phẩm
            - Môn thể thao / danh mục
            - Rating hiển thị
            - Mô tả ngắn
            - Giá
            - Giá cũ
            - Giảm giá
            - Tồn kho
            - Size / lựa chọn
            - Số lượng
            - Thêm vào giỏ hàng
            - Mô tả chi tiết
            - Điểm nổi bật
            - Đối tượng phù hợp
            - Thông số
            - Hướng dẫn sử dụng
            - Hướng dẫn bảo quản
            - Bài tập liên quan
            - Môn thể thao liên quan
            - Sản phẩm liên quan
        -->

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->


    <!-- =====================================================
         IMAGE ENGINE
    ====================================================== -->

    <script src="js/image-factory.js"></script>



    <!-- =====================================================
         DATABASE GỐC

         P01 - P12
    ====================================================== -->

    <script src="js/data.js"></script>



    <!-- =====================================================
         DATABASE MỞ RỘNG

         Bao gồm:

         - Category
         - Metadata P01 - P12
         - Products P13 - P52
         - SEO
         - Related Data

         Sau khi file này chạy:

         products = P01 -> P52
    ====================================================== -->

    <script src="js/catalog-data.js"></script>



    <!-- =====================================================
         LOGIC CHUNG WEBSITE

         Bao gồm:

         - Giỏ hàng
         - Format tiền
         - Utility dùng chung
    ====================================================== -->

    <script src="js/main.js"></script>



    <!-- =====================================================
         PRODUCT DETAIL ENGINE

         File này đọc:

         product.html?id=1

         hoặc:

         product.html?id=P01


         Sau đó tự xử lý:

         - Render sản phẩm
         - Title
         - Meta Description
         - Robots
         - Canonical
         - Open Graph
         - Twitter Card
         - Product Schema
         - Offer Schema
         - Breadcrumb Schema
         - Related Products


         Canonical được chuẩn hóa về:

         product.html?id=P01
         product.html?id=P02
         ...
         product.html?id=P52
    ====================================================== -->

    <script src="js/product.js"></script>



    <!-- =====================================================
         SPORTHUB AI COACH & CUSTOMER ASSISTANT

         Đặt cuối cùng sau:

         - image-factory.js
         - data.js
         - catalog-data.js
         - main.js

    ====================================================== -->

    <script src="js/chatbot.js?v=6.4"></script>


</body>

</html>
