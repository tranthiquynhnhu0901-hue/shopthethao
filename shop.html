            <div class="container">


                <!-- SEARCH + SORT -->

                    <div class="shop-search-box">

                        <span
                            class="shop-search-icon"
                            aria-hidden="true"
                        >
                            🔎
                        </span>

                        <input
                            id="q"
                            type="search"
                            placeholder="Tìm tên sản phẩm, mã P43, Boxing, Pickleball..."
                            autocomplete="off"
                            aria-label="Tìm kiếm sản phẩm"
                            oninput="renderShop()"
                        >

                    </div>



                    <select
                        id="sort"
                        aria-label="Sắp xếp sản phẩm"
                        onchange="renderShop()"
                    >

                        <option value="default">
                            Sắp xếp mặc định
                        </option>

                        <option value="low">
                            Giá thấp → cao
                        </option>

                        <option value="high">
                            Giá cao → thấp
                        </option>

                        <option value="rating">
                            Đánh giá cao
                        </option>

                        <option value="discount">
                            Giảm giá nhiều
                        </option>

                    </select>


                </div>

                            </option>

                                Phụ kiện
